<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos Bancarios</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background:#f3f4f6;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.card{
  background:white;
  width:100%;
  max-width:520px;
  padding:28px;
  border-radius:14px;
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

h2{
  margin-top:0;
  margin-bottom:20px;
  font-size:24px;
}

.data-box{
  background:#f1f3f5;
  padding:18px;
  border-radius:10px;
  font-family:monospace;
  line-height:1.7;
  font-size:15px;
  word-break:break-word;
}

.label{
  color:#555;
}

button{
  width:100%;
  margin-top:22px;
  padding:15px;
  font-size:17px;
  border:none;
  border-radius:10px;
  background:#4CAF50;
  color:white;
  cursor:pointer;
  font-weight:600;
  transition:all .2s ease;
}

button:hover{
  background:#3f9844;
}

.success{
  text-align:center;
  margin-top:12px;
  color:#4CAF50;
  font-size:14px;
  display:none;
}

@media (max-width:480px){

  .card{
    padding:22px;
  }

  h2{
    font-size:20px;
  }

  .data-box{
    font-size:14px;
  }

}
</style>

</head>

<body>

<div class="card">

<h2>Datos Bancarios</h2>

<div class="data-box">
<div><span class="label">Nombre:</span> CARLOS MATIAS SOUTO MONTECINOS</div>
<div><span class="label">RUT:</span> 18429480-K</div>
<div><span class="label">Banco:</span> Banco Estado</div>
<div><span class="label">Tipo Cuenta:</span> Cuenta Corriente</div>
<div><span class="label">Numero de cuenta:</span> 80000185322</div>
<div><span class="label">Correo:</span> csouto@bancoestado.cl</div>
</div>

<button onclick="copiarDatos()">Copiar datos</button>

<div id="msg" class="success">
✅ Datos copiados al portapapeles
</div>

</div>

<script>

function copiarDatos(){

const datos = `CARLOS MATIAS SOUTO MONTECINOS
18429480-K
Banco Estado
Cuenta Corriente
80000185322
csouto@bancoestado.cl`;

navigator.clipboard.writeText(datos);

document.getElementById("msg").style.display="block";

}

</script>

</body>
</html>
