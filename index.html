<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos Bancarios</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
  padding:20px;
}

.card{
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  width:100%;
  max-width:500px;
}

h2{
  margin-top:0;
}

textarea{
  width:100%;
  border:none;
  background:#eee;
  padding:15px;
  border-radius:8px;
  font-size:14px;
  resize:none;
}

button{
  width:100%;
  margin-top:20px;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#4CAF50;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#3e9442;
}

.mensaje{
  margin-top:10px;
  color:#4CAF50;
  text-align:center;
  display:none;
}
</style>

</head>

<body>

<div class="card">

<h2>Datos Bancarios</h2>

<textarea disabled>
Nombre: CARLOS MATIAS SOUTO MONTECINOS
RUT: 18429480-K
Banco: Banco Estado
Tipo Cuenta: Cuenta Corriente
Numero de cuenta: 80000185322
Correo: csouto@bancoestado.cl
</textarea>

<button onclick="copiar()">Copiar datos</button>

<div id="ok" class="mensaje">✅ Datos copiados</div>

</div>

<script>
function copiar(){

const datos = `CARLOS MATIAS SOUTO MONTECINOS
18429480-K
Banco Estado
Cuenta Corriente
80000185322
csouto@bancoestado.cl`;

navigator.clipboard.writeText(datos);

document.getElementById("ok").style.display="block";

}
</script>

</body>
</html>
