<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos Bancarios</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f3f4f6;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
margin:0;
padding:20px;
}

.card{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 6px 20px rgba(0,0,0,0.08);
width:100%;
max-width:500px;
}

h2{
margin-top:0;
margin-bottom:20px;
}

textarea{
width:100%;
border:none;
background:#f0f0f0;
padding:15px;
border-radius:8px;
font-size:14px;
resize:none;
height:140px;
}

button{
width:100%;
margin-top:20px;
padding:14px;
font-size:16px;
border:none;
border-radius:8px;
background:#4CAF50;
color:white;
cursor:pointer;
transition:background 0.2s;
}

button:hover{
background:#3e9442;
}

.copy-msg{
text-align:center;
margin-top:10px;
color:#4CAF50;
display:none;
font-size:14px;
}

@media (max-width:480px){

.card{
padding:20px;
}

textarea{
font-size:13px;
}

}

</style>

</head>

<body>

<div class="card">

<h2>Datos Bancarios</h2>

<textarea id="datos" disabled>
Nombre: MANUEL ANDRES FLORES PEREIRA
RUT: 17.306.232-K
Banco: BancoEstado
Tipo de cuenta: Cuenta Corriente
Número de cuenta: 80000186582
Correo: manuel.fp09@gmail.com
</textarea>

<button onclick="copiar()">Copiar datos</button>

<div class="copy-msg" id="msg">✅ Datos copiados al portapapeles</div>

</div>

<script>

function copiar(){

const texto = `MANUEL ANDRES FLORES PEREIRA
17.306.232-K
BancoEstado
Cuenta Corriente
80000186582
manuel.fp09@gmail.com`;

navigator.clipboard.writeText(texto);

document.getElementById("msg").style.display="block";

}

</script>

</body>
</html>
